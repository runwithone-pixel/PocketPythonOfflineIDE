name: Build PocketPython APK from uploaded ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source ZIP exists
        run: test -f PocketPython_Offline_IDE_Source.zip

      - name: Extract source ZIP
        shell: bash
        run: |
          mkdir -p _build
          unzip -q PocketPython_Offline_IDE_Source.zip -d _build
          PROJECT_DIR="$(find _build -mindepth 1 -maxdepth 4 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts inside source ZIP" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up build-time Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run host-side tests and Python syntax checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile app/src/main/python/runner.py app/src/main/python/pip_manager.py

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPython-Offline-IDE-debug-apk
          path: _build/PocketPython_Offline_IDE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
